name: traffic
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.4
  photo_view: ^0.14.0
  shared_preferences: ^2.0.15
  firebase_core: ^3.13.0   # Updated version of firebase_core
  cloud_firestore: ^5.6.6  # Make sure to use a compatible version of cloud_firestore
  firebase_storage: ^12.4.5
  connectivity_plus: ^5.0.1
  image_picker: ^1.1.2
  firebase_auth : ^5.5.2
  path: ^1.8.0
  provider: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path : "assets/AppScreenphoto.webp"

flutter_lints: ^2.0.0
flutter_zoom_driver: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/


